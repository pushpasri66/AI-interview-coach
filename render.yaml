# Render.com Blueprint — AI Interview Coach
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-interview-coach
    runtime: python
    plan: free               # change to "starter" ($7/mo) for always-on
    buildCommand: "./build.sh"
    startCommand: "gunicorn -c deployment/gunicorn.conf.py app:app"
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-coach-db
          property: externalConnectionString
      - key: WTF_CSRF_ENABLED
        value: "True"
      - key: AI_API_KEY
        value: replace-with-your-ai-api-key

databases:
  - name: ai-interview-coach-db
    databaseName: ai_interview_coach
    user: ai_coach
    plan: free               # 1 GB free PostgreSQL included
