version: '3.8'

services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: ai_coach_web
    restart: always
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/ai_interview_coach
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=prod-secret-key-ai-interview-coach-2026-xyz!
    volumes:
      - ../uploads:/app/uploads
      - ../reports:/app/reports
      - ../logs:/app/logs
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: ai_coach_db
    restart: always
    environment:
      - POSTGRES_DB=ai_interview_coach
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: ai_coach_redis
    restart: always
    ports:
      - "6379:6379"

  nginx:
    image: nginx:1.25-alpine
    container_name: ai_coach_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/static:/usr/share/nginx/html/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
