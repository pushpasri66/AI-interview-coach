{% extends "base.html" %}

{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<section class="error-section">
    <div class="error-container">
        <div class="error-card">
            <div class="error-code text-danger">500</div>
            <h1 class="error-title">Internal Server Error</h1>
            <p class="error-description">Something went wrong on our servers. Our team has been notified.</p>
            <div class="error-actions">
                <a href="{{ url_for('main.home') }}" class="btn btn-primary">
                    <i class="fa-solid fa-house"></i> Return to Home
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
